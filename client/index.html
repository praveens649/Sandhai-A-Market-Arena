<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO & Identification -->
    <title>Sandhai — A Marketplace Arena | Farm-Fresh Groceries & Produce</title>
    <meta
      name="description"
      content="Sandhai is your trusted community marketplace arena for farm-fresh fruits, organic vegetables, daily dairy essentials, and kitchen staples delivered directly to your doorstep."
    />
    <meta
      name="keywords"
      content="sandhai, marketplace arena, fresh produce, organic vegetables, farm to door, online grocery store, fruits, dairy, staples, chennai, tamil nadu"
    />
    <meta name="author" content="Sandhai Marketplace Arena" />
    <meta name="application-name" content="Sandhai" />

    <!-- Favicon & Icons (Multi-format for Cross-browser Compatibility) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />

    <!-- Dynamic Theme Colors -->
    <meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />

    <!-- Mobile Web App & PWA Settings -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sandhai" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sandhai — A Marketplace Arena" />
    <meta property="og:title" content="Sandhai — A Marketplace Arena | Farm-Fresh Groceries & Produce" />
    <meta
      property="og:description"
      content="Order crisp harvest fruits, organic greens, morning dairy, and pantry essentials with honest local pricing and fast doorstep delivery."
    />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&h=630&q=80"
    />
    <meta property="og:image:alt" content="Sandhai Fresh Marketplace Arena Display" />
    <meta property="og:url" content="https://sandhaii.netlify.app" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sandhai — A Marketplace Arena | Farm-Fresh Groceries" />
    <meta
      name="twitter:description"
      content="Direct-from-farm produce, verified organic staples, and fast doorstep delivery."
    />
    <meta
      name="twitter:image"
      content="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&h=630&q=80"
    />

    <!-- Google Font Preconnect for Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
