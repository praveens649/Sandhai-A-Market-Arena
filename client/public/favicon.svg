<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sandhaiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Brand Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#sandhaiGrad)" filter="url(#shadow)" />

  <!-- Shopping Bag Body -->
  <path
    d="M18 24 L46 24 L43 50 C42.8 52 41 53.5 39 53.5 L25 53.5 C23 53.5 21.2 52 21 50 L18 24 Z"
    fill="#ffffff"
  />

  <!-- Shopping Bag Handle -->
  <path
    d="M26 24 V19 C26 15.7 28.7 13 32 13 C35.3 13 38 19 38 19 V24"
    fill="none"
    stroke="#ffffff"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Fresh Market Sprout / Leaf Motif -->
  <path
    d="M32 28 C32 28 39 31 39 38 C39 42 35 44 32 44 C29 44 25 42 25 38 C25 31 32 28 32 28 Z"
    fill="url(#leafGrad)"
  />
  <path
    d="M32 30 V42"
